 
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM CAL">
<title>GYM CALENDAR</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;padding:20px 14px 100px}
.app{max-width:560px;margin:auto}
.hero{padding:24px 18px;border:1px solid #303239;border-radius:24px;background:linear-gradient(145deg,#17181c,#08090b)}
.hero small{letter-spacing:.15em;color:#aaa;font-weight:700}
.hero h1{margin:7px 0 4px;font-size:34px}.hero h1 span{color:#ff2538}
.hero p{margin:0;color:#aaa;font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.stat{background:#101115;border:1px solid #303239;border-radius:15px;padding:12px}
.stat small{color:#999}.stat strong{display:block;font-size:26px;margin-top:4px}
.card{border:1px solid #303239;border-radius:20px;overflow:hidden}
.head{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#0d0e11}
.head button{width:42px;height:42px;border:1px solid #333;border-radius:12px;background:#17181c;color:white;font-size:24px}
.month{text-align:center;font-weight:900}.month small{display:block;color:#999;font-size:10px;margin-top:3px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.week{background:#111216;border-top:1px solid #333;border-bottom:1px solid #333}
.week div{text-align:center;padding:8px 0;font-size:11px;font-weight:900}
.week div:first-child{color:#ff4c5c}
.grid{gap:1px;background:#292b30}
.day{aspect-ratio:.82;border:0;background:#f4f4f2;color:#111;position:relative}
.blank{background:#090a0c}
.num{position:absolute;top:5px;left:6px;font-size:13px;font-weight:900}
.sun .num{color:#ff2538}.sat .num{color:#777}
.mark{width:31px;height:31px;border:2px solid #181818;border-radius:50%;position:absolute;left:50%;top:56%;transform:translate(-50%,-50%)}
.done .mark{background:#ff2538;border-color:#ff2538;box-shadow:0 0 13px #ff253888}
.today:after{content:"TODAY";position:absolute;right:3px;top:4px;background:#111;color:#fff;font-size:6px;padding:2px 3px;border-radius:3px}
.note{text-align:center;padding:10px;background:#0c0d0f;color:#aaa;font-size:11px}
.quote{margin-top:12px;border-left:3px solid #ff2538;padding:13px;background:#13090b;font-size:13px;line-height:1.5}
.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bottom button{display:block;max-width:532px;width:100%;margin:auto;border:0;border-radius:15px;padding:14px;background:#ff2538;color:white;font-weight:900;font-size:15px}
</style>
</head>
<body>
<div class="app">
<div class="hero">
<small>TRAIN TODAY, A BETTER YOU TOMORROW.</small>
<h1><span>GYM</span> CALENDAR</h1>
<p>日付をタップ → 赤 = ジム行った！</p>
</div>

<div class="stats">
<div class="stat"><small>今月</small><strong id="monthCount">0 / 12</strong></div>
<div class="stat"><small>今週</small><strong id="weekCount">0 / 3</strong></div>
</div>

<div class="card">
<div class="head">
<button id="prev">‹</button>
<div class="month"><span id="label"></span><small>もう一度タップで解除</small></div>
<button id="next">›</button>
</div>
<div class="week">
<div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
</div>
<div class="grid" id="grid"></div>
<div class="note">🔴 赤丸の日 = ジム達成</div>
</div>

<div class="quote"><b>完璧より「行った」を積み上げる。</b><br>今日も1タップだけ。</div>
</div>

<div class="bottom"><button id="today">今日を赤にする 🔴</button></div>

<script>
const STORE="gym-simple-v1";
let rec=JSON.parse(localStorage.getItem(STORE)||"{}");
const now=new Date();
let y=now.getFullYear(),m=now.getMonth();
const names=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
const pad=n=>String(n).padStart(2,"0");
const key=(Y,M,D)=>`${Y}-${pad(M+1)}-${pad(D)}`;

function toggle(k){
 rec[k]?delete rec[k]:rec[k]=1;
 localStorage.setItem(STORE,JSON.stringify(rec));
 render();
}

function render(){
 label.textContent=`${y} ${names[m]}`;
 grid.innerHTML="";
 const first=new Date(y,m,1).getDay();
 const days=new Date(y,m+1,0).getDate();

 for(let i=0;i<first;i++){
  let b=document.createElement("div");
  b.className="day blank";
  grid.appendChild(b);
 }

 for(let d=1;d<=days;d++){
  const dow=new Date(y,m,d).getDay();
  const k=key(y,m,d);
  let b=document.createElement("button");
  b.className=`day ${dow==0?"sun":""} ${dow==6?"sat":""} ${rec[k]?"done":""}`;
  if(y==now.getFullYear()&&m==now.getMonth()&&d==now.getDate())b.classList.add("today");
  b.innerHTML=`<span class="num">${d}</span><span class="mark"></span>`;
  b.onclick=()=>toggle(k);
  grid.appendChild(b);
 }

 const monthPrefix=`${y}-${pad(m+1)}-`;
 const mc=Object.keys(rec).filter(k=>k.startsWith(monthPrefix)).length;
 monthCount.textContent=`${mc} / 12`;

 const sun=new Date(now);
 sun.setDate(now.getDate()-now.getDay());
 let wc=0;
 for(let i=0;i<7;i++){
  const d=new Date(sun);
  d.setDate(sun.getDate()+i);
  if(rec[key(d.getFullYear(),d.getMonth(),d.getDate())])wc++;
 }
 weekCount.textContent=`${wc} / 3`;
}

prev.onclick=()=>{m--;if(m<0){m=11;y--}render()};
next.onclick=()=>{m++;if(m>11){m=0;y++}render()};
today.onclick=()=>{y=now.getFullYear();m=now.getMonth();toggle(key(y,m,now.getDate()))};
render();
</script>
</body>
</html>
